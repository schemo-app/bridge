<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="view view-main">
    <header class="head">
      <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6a6cff"/>
            <stop offset="1" stop-color="#3a2bd1"/>
          </linearGradient>
          <clipPath id="lc"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
          <filter id="ls" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
          </filter>
        </defs>
        <g filter="url(#ls)">
          <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#lg)"/>
          <g clip-path="url(#lc)">
            <path d="M512 -78A300 300 0 0 0 512 522Z" fill="#ffffff"/>
            <path d="M512 522A300 300 0 0 1 512 1122Z" fill="#ffb08a"/>
          </g>
        </g>
      </svg>
      <div class="head-text">
        <span class="head-title">Schemo</span>
        <span class="head-status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text"></span>
        </span>
      </div>
      <button class="icon-btn" id="open-settings" data-i18n-title="settings" data-i18n-aria-label="settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </header>

    <div class="body">
      <div class="warn" id="warn-card" hidden>
        <span class="warn-text" id="warn-text"></span>
        <button class="btn-accent" id="warn-launch" data-i18n="launchApp"></button>
      </div>

      <div class="tab-card" id="current-card">
        <div class="tab-row">
          <span class="icon-slot" id="current-icon"></span>
          <div class="tab-text">
            <span class="tab-title" id="current-title"></span>
            <span class="tab-host mono" id="current-host"></span>
          </div>
          <label class="switch">
            <input type="checkbox" id="enabled" />
            <span class="track"></span>
          </label>
        </div>
        <div class="tab-foot" id="current-foot" hidden>
          <span class="tab-count" id="current-count"></span>
          <span class="tab-ago" id="current-ago"></span>
          <span class="spacer"></span>
          <svg class="tab-arrow" id="current-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </div>
      </div>

      <div class="action-error" id="error-line" hidden>
        <span id="error-text"></span>
      </div>

      <section class="more" id="more-section" hidden>
        <span class="section-label" data-i18n="moreCapturing"></span>
        <div class="more-list" id="more-list"></div>
      </section>

      <button class="btn-field" id="open-app" data-i18n="openApp"></button>
    </div>
  </div>

  <div class="view view-settings">
    <header class="head head-settings">
      <button class="icon-btn" id="close-settings" data-i18n-title="back" data-i18n-aria-label="back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <span class="settings-title" data-i18n="settings"></span>
    </header>

    <div class="settings-body">
      <div class="row row-remember">
        <div class="row-text">
          <span class="row-name strong" data-i18n="settingRemember"></span>
          <span class="row-hint" data-i18n="settingRememberHint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="set-rememberTabs" />
          <span class="track"></span>
        </label>
      </div>

      <div class="filters-head">
        <span class="section-label" data-i18n="settingFilters"></span>
        <span class="row-hint" id="filters-hint"></span>
      </div>

      <fieldset class="filters" id="filters">
        <div class="row">
          <span class="row-name" data-i18n="filterHosts"></span>
          <div class="segmented" role="radiogroup">
            <span class="seg-thumb" id="hosts-thumb"></span>
            <button type="button" class="seg" id="hosts-all" data-i18n="filterHostsAll"></button>
            <button type="button" class="seg" id="hosts-list" data-i18n="filterHostsList"></button>
          </div>
        </div>
        <div class="row-input" id="hosts-input-row" hidden>
          <input type="text" id="hosts-input" spellcheck="false" autocomplete="off" data-i18n-placeholder="filterHostsPlaceholder" />
        </div>

        <div class="row ruled">
          <span class="row-name" data-i18n="filterStatic"></span>
          <span class="row-value" id="static-value"></span>
          <label class="switch">
            <input type="checkbox" id="filter-static" />
            <span class="track"></span>
          </label>
        </div>

        <div class="row ruled">
          <span class="row-name" data-i18n="filterAnalytics"></span>
          <span class="row-value" id="analytics-value"></span>
          <label class="switch">
            <input type="checkbox" id="filter-analytics" />
            <span class="track"></span>
          </label>
        </div>

        <div class="row row-last">
          <span class="row-name" data-i18n="filterJson"></span>
          <span class="row-value" id="json-value"></span>
          <label class="switch">
            <input type="checkbox" id="filter-json" />
            <span class="track"></span>
          </label>
        </div>
      </fieldset>

      <div class="version mono" id="settings-version"></div>
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
